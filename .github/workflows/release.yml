name: release

# Tag a version (e.g. `git tag v0.1.0 && git push --tags`) — or run this manually
# via workflow_dispatch — to build every platform binary, write SHA256SUMS.txt,
# and attach them to the GitHub Release. The install scripts download and verify
# those artifacts, so users never compile.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify
        run: |
          deno fmt --check *.ts
          deno lint *.ts
          deno check *.ts
          deno test -A

      - name: Version consistency
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          src=$(grep -oE 'const VERSION = "[0-9]+\.[0-9]+\.[0-9]+"' supa.ts | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          cfg=$(grep -oE '"version": "[0-9]+\.[0-9]+\.[0-9]+"' deno.json | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "tag=$tag  supa.ts=$src  deno.json=$cfg"
          test "$tag" = "$src" && test "$tag" = "$cfg" || { echo "::error::version mismatch"; exit 1; }

      - name: Build all targets + checksums
        run: ./build.sh release   # deno cross-compiles every target from Linux

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/supa-*

      - name: Publish release with binaries
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/supa-*
            dist/SHA256SUMS.txt
          generate_release_notes: true
